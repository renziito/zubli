name: Daily YouTube discovery
on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zubli-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.3
      - name: Discover candidate metadata only
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python pipeline/discover.py
      - name: Commit discovery metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/discovered
          git diff --cached --quiet || (git commit -m "chore: refresh discovery candidates" && git push)
