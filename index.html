<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#211b38"><meta name="description" content="Aprende idiomas con escenas de películas y series.">
<title>ZUBLI — El mundo habla. Tú lo entiendes.</title>
<link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./css/app.css">
</head>
<body>
<header><a class="logo" href="./">zubli<span>.</span></a><button id="progressBtn" class="navbtn">Mi progreso</button></header>
<main>
<section id="home" class="panel">
<p class="eyebrow">APRENDE ESCUCHANDO</p><h1>El mundo habla.<br><em>Tú lo entiendes.</em></h1>
<p class="lead">Practica con películas y series en su plataforma original, usando subtítulos disponibles y verificables.</p>
<div class="filters">
<label>Idioma de la interfaz<select id="uiLanguage"><option value="es">Español</option><option value="en">English</option></select></label>
<label>Quiero aprender<select id="targetLanguage"><option value="en">Inglés</option><option value="es">Español</option><option value="fr">Francés</option><option value="de">Alemán</option><option value="it">Italiano</option><option value="ja">Japonés</option></select></label>
<label>Película, serie o tema<input id="topic" placeholder="Ej. comedy, classic film, drama" maxlength="80"></label>
</div>
<button id="searchBtn" class="primary">Buscar videos con subtítulos</button>
<p id="status" class="status" role="status"></p><div id="results" class="results"></div>
</section>
<section id="practice" class="panel hidden">
<button id="backBtn" class="quiet">← Volver a resultados</button><h2 id="clipTitle"></h2>
<div id="practicePlayer" class="player"></div>
<p id="statusPractice" class="status" role="status"></p>
<div id="exerciseArea" class="exercise hidden">
<p id="counter" class="eyebrow"></p><p id="hint" class="hint"></p>
<label for="answer">Escribe lo que escuchaste</label><textarea id="answer" rows="3" placeholder="Type what you hear…"></textarea>
<p id="feedback" class="feedback"></p>
<div class="exercise-actions"><button id="checkBtn" class="primary">Comprobar</button><button id="nextBtn" class="primary hidden">Siguiente frase</button><button id="skipBtn" class="quiet">Saltar</button></div>
</div>
</section>
<section id="progress" class="panel hidden"><h2>Mi progreso</h2><p id="stats"></p><button id="homeBackBtn" class="primary">Volver al inicio</button></section>
</main><footer>ZUBLI · El mundo habla. Tú lo entiendes.</footer>
<script type="module" src="./js/app.js"></script>
</body></html>
